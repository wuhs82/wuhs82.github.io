<!DOCTYPE html>
<!--
  存在しないページ（例：https://ユーザー名.github.io/abc）を開いたときに表示されるページです．
  GitHub Pages は，いちばん上のフォルダに 404.html があると，自動でこのページを使います．
  自分のサイトのデザインに合わせて，書きかえてもかまいません．
-->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | To. Portfolio</title>

    <style>
        /* ===== 全体の基本設定 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f5f7;
            color: #222;
            font-family: "Helvetica Neue", Arial,
                         "Hiragino Kaku Gothic ProN", sans-serif;
            line-height: 1.8;
        }

        /* ===== 雑誌風のページ全体 ===== */
        .container {
            max-width: 1000px;
            min-height: calc(100vh - 80px);
            margin: 40px auto;
            padding: 50px 60px;
            background-color: #fff;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.06);

            display: flex;
            flex-direction: column;
        }

        /* ===== ヘッダー ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #111;
            padding-bottom: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .header-label {
            font-size: 12px;
            color: #666;
            letter-spacing: 2px;
        }

        /* ===== 404 メインエリア ===== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 70px 0;
        }

        .error-label {
            color: #2457a7;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        /* 大きな404 */
        .error-code {
            font-size: clamp(100px, 20vw, 200px);
            font-weight: bold;
            line-height: 1;
            letter-spacing: -8px;
            color: #111;
            border-bottom: 1px solid #ddd;
            padding-bottom: 35px;
        }

        .error-code span {
            color: #2457a7;
        }

        /* ===== エラーメッセージ ===== */
        .error-message {
            margin-top: 45px;
        }

        .error-message h1 {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .error-message p {
            color: #777;
            font-size: 15px;
            line-height: 2;
        }

        /* ===== トップページへ戻るリンク ===== */
        .back-link {
            display: inline-block;
            align-self: flex-start;
            margin-top: 45px;
            padding: 12px 30px;
            border: 1px solid #2457a7;
            color: #2457a7;
            background-color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .back-link:hover {
            background-color: #2457a7;
            color: #fff;
        }

        /* ===== フッター ===== */
        footer {
            border-top: 2px solid #111;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #777;
        }

        /* ===== スマートフォン向け ===== */
        @media (max-width: 600px) {
            .container {
                min-height: 100vh;
                min-height: 100dvh;
                margin: 0;
                padding: 25px 20px;
                box-shadow: none;
            }

            .logo {
                font-size: 20px;
            }

            .header-label {
                font-size: 10px;
                letter-spacing: 1px;
            }

            main {
                padding: 60px 0;
            }

            .error-label {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .error-code {
                font-size: clamp(90px, 24vw, 140px);
                letter-spacing: -5px;
                padding-bottom: 25px;
            }

            .error-message {
                margin-top: 35px;
            }

            .error-message h1 {
                font-size: 24px;
            }

            .error-message p {
                font-size: 14px;
            }

            .back-link {
                margin-top: 35px;
                padding: 10px 22px;
                font-size: 12px;
            }

            footer {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <!-- 雑誌風のページ全体 -->
    <div class="container">

        <!-- ヘッダー -->
        <header>
            <div class="logo">TO.</div>
            <div class="header-label">PERSONAL PORTFOLIO</div>
        </header>

        <!-- 404 エラーページ -->
        <main>
            <p class="error-label">PAGE NOT FOUND / ERROR 404</p>

            <div class="error-code">
                404<span>.</span>
            </div>

            <!-- エラーメッセージ -->
            <div class="error-message">
                <h1>
                    お探しのページは<br>
                    見つかりませんでした。
                </h1>

                <p>
                    URLが間違っているか、<br>
                    ページが移動・削除された可能性があります。
                </p>
            </div>

            <!-- トップページに戻る -->
            <a href="/" class="back-link">
                ← BACK TO HOME
            </a>
        </main>

        <!-- フッター -->
        <footer>
            <span>TO. PORTFOLIO</span>
            <span>THANK YOU</span>
        </footer>

    </div>
</body>
</html>
